# Production stack for EC2. AWS credentials come from the instance IAM role,
# never from the image or a committed file.
#
#   cp .env.example .env
#   docker-compose -f docker-compose.prod.yml up -d --build

name: riskforge

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: riskforge-backend:prod
    container_name: riskforge-backend
    env_file:
      - .env
    environment:
      APP_ENV: production
    expose:
      - "8000"
    networks:
      - riskforge
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ""
    image: riskforge-frontend:prod
    container_name: riskforge-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:8080"
    networks:
      - riskforge
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  riskforge:
    driver: bridge
