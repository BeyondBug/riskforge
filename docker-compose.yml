# Local development stack. Mirrors the production topology so that
# `curl http://localhost/api/health` behaves the same on a laptop and on EC2.
services:
  backend:
    build:
      context: ./backend
    container_name: riskforge-backend
    env_file:
      - .env
    environment:
      APP_ENV: development
    expose:
      - "8000"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    container_name: riskforge-web
    depends_on:
      - backend
    ports:
      - "80:8080"
    restart: unless-stopped
