# RiskForge edge configuration.
# Serves the built React bundle and proxies /api to the FastAPI container.

worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $status "$request" '
                    '$body_bytes_sent rt=$request_time';
    access_log /dev/stdout main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 10 requests/second per client IP, with a short burst allowance so a
    # single page load (several parallel XHRs) is not throttled.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_status 429;

    upstream riskforge_api {
        server backend:8000;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass         http://riskforge_api;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection "";
            proxy_read_timeout 60s;
        }

        location /docs {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass       http://riskforge_api;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass       http://riskforge_api;
            proxy_set_header Host $host;
        }

        location /assets/ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
